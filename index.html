<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PlantPro — RMC Plant Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pri:#6366f1;--pri-d:#4f46e5;--pri-l:#e0e7ff;
  --grn:#10b981;--grn-d:#059669;--grn-l:#d1fae5;
  --red:#ef4444;--red-d:#dc2626;--red-l:#fee2e2;
  --amb:#f59e0b;--amb-d:#d97706;--amb-l:#fef3c7;
  --sky:#0ea5e9;--sky-d:#0284c7;--sky-l:#e0f2fe;
  --pur:#8b5cf6;--pur-d:#7c3aed;--pur-l:#ede9fe;
  --orn:#f97316;--orn-d:#ea580c;--orn-l:#ffedd5;
  --bg:#f0f4ff;--surf:#fff;--b:#e2e8f0;--t:#0f172a;--m:#64748b;
  --r:14px;--r2:10px;--sh:0 4px 24px rgba(99,102,241,.15);--sh2:0 1px 4px rgba(0,0,0,.06);
  font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
}
body{background:var(--bg);color:var(--t);min-height:100vh;font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:var(--pri);border-radius:4px}

/* LOGIN */
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  position:relative;overflow:hidden;padding:20px}
.lp-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px);opacity:.35}
.orb1{width:500px;height:500px;background:#6366f1;top:-150px;left:-100px}
.orb2{width:400px;height:400px;background:#8b5cf6;bottom:-100px;right:-80px}
.orb3{width:280px;height:280px;background:#06b6d4;top:30%;left:55%}
.lb{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:24px;
  padding:44px 40px;width:100%;max-width:440px;
  box-shadow:0 32px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.1);
  position:relative;z-index:2;animation:cardIn .7s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.lb-logo{text-align:center;margin-bottom:32px}
.lb-ico{font-size:3.5rem;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 12px rgba(99,102,241,.4))}
.lb-logo h1{font-size:1.55rem;font-weight:800;color:#0f172a;letter-spacing:-.5px}
.lb-logo p{font-size:.8rem;color:#64748b;margin-top:4px}
.lb-ver{display:inline-block;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  padding:2px 12px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.5px;margin-top:8px}
.rtabs{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px;margin-bottom:28px}
.rtab{flex:1;padding:10px 6px;border:none;background:transparent;border-radius:9px;cursor:pointer;
  font-size:.77rem;font-weight:700;color:#64748b;transition:all .2s;font-family:inherit;line-height:1.3}
.rtab.act{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(99,102,241,.2)}
.lf{margin-bottom:18px}
.lf label{display:block;font-size:.7rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.lf input{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;
  font-size:.9rem;outline:none;background:#f8fafc;color:#0f172a;font-family:inherit;transition:all .18s}
.lf input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.lbtn{width:100%;padding:14px;background:linear-gradient(135deg,var(--pri),var(--pur));
  color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .2s;box-shadow:0 4px 16px rgba(99,102,241,.35);margin-top:4px}
.lbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.45)}
.lbtn:active{transform:none}
.lerr{display:none;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:9px;
  padding:10px 14px;font-size:.8rem;text-align:center;margin-top:10px;font-weight:600}
.lsec{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;font-size:.72rem;color:#94a3b8}

/* APP */
#app{display:none}
.app-wrap{display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);
  color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;transition:transform .3s}
.sb-head{padding:18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-logo .ico{font-size:1.8rem}
.sb-logo h2{font-size:.95rem;font-weight:800;color:#fff}
.sb-logo p{font-size:.62rem;color:#94a3b8}
.sb-user{padding:12px;background:rgba(255,255,255,.06);margin:12px;border-radius:10px;border:1px solid rgba(255,255,255,.06)}
.su-name{font-size:.82rem;font-weight:700;color:#e2e8f0}
.su-role{font-size:.67rem;color:#94a3b8;margin-top:2px}
.su-plant{font-size:.65rem;color:#a5b4fc;margin-top:3px;font-weight:600}
nav{flex:1;padding:8px 0;overflow-y:auto}
.nsec{padding:8px 18px 3px;font-size:.6rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:.82rem;
  font-weight:600;color:#94a3b8;transition:all .18s;position:relative;margin:1px 8px;border-radius:9px}
.ni:hover{background:rgba(255,255,255,.07);color:#e2e8f0}
.ni.act{background:rgba(99,102,241,.25);color:#a5b4fc}
.ni.act::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:65%;background:var(--pri);border-radius:0 2px 2px 0}
.ni-ico{font-size:1rem;width:20px;text-align:center}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.06)}
.sb-foot button{width:100%;padding:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);
  color:#fca5a5;border-radius:9px;cursor:pointer;font-size:.8rem;font-weight:700;font-family:inherit;transition:all .2s}
.sb-foot button:hover{background:rgba(239,68,68,.28);color:#fff}
.content{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--b);padding:0 24px;height:60px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:var(--sh2)}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-l h2{font-size:.98rem;font-weight:800;color:#0f172a}
.tb-crumb{font-size:.72rem;color:#94a3b8}
.tb-r{display:flex;align-items:center;gap:7px}
.tb-bdg{border-radius:20px;padding:5px 12px;font-size:.73rem;font-weight:700}
.bdg-role{background:var(--pri-l);color:var(--pri-d)}
.bdg-plant{background:var(--grn-l);color:var(--grn-d)}
.pc{padding:22px;flex:1}
.mob-menu{display:none;font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:7px}
.mob-menu:hover{background:#f1f5f9}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:20px}
.sc{background:#fff;border-radius:var(--r);padding:18px 16px;box-shadow:var(--sh2);
  border-top:4px solid var(--pri);transition:all .2s;position:relative;overflow:hidden}
.sc:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.sc.g{border-top-color:var(--grn)}.sc.r{border-top-color:var(--red)}
.sc.a{border-top-color:var(--amb)}.sc.s{border-top-color:var(--sky)}
.sc.p{border-top-color:var(--pur)}.sc.o{border-top-color:var(--orn)}
.sc-bg-ico{position:absolute;right:12px;top:12px;font-size:2rem;opacity:.1}
.sc-lb{font-size:.63rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sc-val{font-size:1.9rem;font-weight:800;color:#0f172a;letter-spacing:-1px;line-height:1}
.sc-sub{font-size:.7rem;color:#64748b;margin-top:5px}

/* SEC */
.sec{background:#fff;border-radius:var(--r);box-shadow:var(--sh2);margin-bottom:18px;overflow:hidden;border:1px solid rgba(0,0,0,.03)}
.sec-h{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:8px;background:linear-gradient(135deg,#fff,#fafbff)}
.sec-h h3{font-size:.9rem;font-weight:800;color:#0f172a}
.sec-b{padding:18px 20px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.79rem}
thead th{background:#f8fafc;color:#374151;font-weight:700;font-size:.67rem;text-transform:uppercase;
  letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid #e2e8f0;text-align:left;white-space:nowrap}
tbody tr{transition:background .1s}tbody tr:hover{background:#f5f7ff}
tbody tr:nth-child(even){background:#fafafa}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.nd{text-align:center;padding:36px;color:#94a3b8;font-size:.85rem}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:9px;
  border:none;cursor:pointer;font-size:.79rem;font-weight:700;font-family:inherit;transition:all .18s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--pri),var(--pur));color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.btn-p:hover{box-shadow:0 4px 16px rgba(99,102,241,.4);transform:translateY(-1px)}
.btn-g{background:var(--grn);color:#fff}.btn-g:hover{background:var(--grn-d)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:var(--red-d)}
.btn-a{background:var(--amb);color:#fff}.btn-a:hover{background:var(--amb-d)}
.btn-s{background:var(--sky);color:#fff}.btn-s:hover{background:var(--sky-d)}
.btn-pu{background:var(--pur);color:#fff}.btn-pu:hover{background:var(--pur-d)}
.btn-o{background:transparent;border:1.5px solid var(--pri);color:var(--pri)}.btn-o:hover{background:var(--pri-l)}
.btn-gh{background:#f1f5f9;color:#475569}.btn-gh:hover{background:#e2e8f0}
.btn-sm{padding:5px 10px;font-size:.73rem;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:.67rem;border-radius:6px}
.iab{display:flex;gap:4px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.66rem;font-weight:700}
.b-g{background:var(--grn-l);color:var(--grn-d)}.b-r{background:var(--red-l);color:var(--red-d)}
.b-a{background:var(--amb-l);color:var(--amb-d)}.b-p{background:var(--pri-l);color:var(--pri-d)}
.b-s{background:var(--sky-l);color:var(--sky-d)}.b-pu{background:var(--pur-l);color:var(--pur-d)}
.b-o{background:var(--orn-l);color:var(--orn-d)}.b-gr{background:#f1f5f9;color:#475569}

/* AVATAR */
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.82rem;color:#fff;flex-shrink:0}
.av-p{background:linear-gradient(135deg,var(--pri),var(--pur))}
.av-g{background:linear-gradient(135deg,var(--grn),var(--sky))}
.av-a{background:linear-gradient(135deg,var(--amb),var(--orn))}
.av-r{background:linear-gradient(135deg,var(--red),var(--orn))}

/* TOOLBAR */
.tb2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.sbox{position:relative;flex:1;min-width:200px}
.sbox input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--b);border-radius:9px;
  font-size:.82rem;outline:none;background:#fff;font-family:inherit;transition:all .18s}
.sbox input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.sbox::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.8rem}
.fsel{padding:8px 10px;border:1.5px solid var(--b);border-radius:9px;font-size:.79rem;
  background:#fff;outline:none;cursor:pointer;font-family:inherit}
.fsel:focus{border-color:var(--pri)}

/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--b);flex-wrap:wrap;gap:8px}
.pag-i{font-size:.74rem;color:#94a3b8}
.pag-b{display:flex;gap:4px}
.pb{padding:6px 11px;border:1.5px solid var(--b);background:#fff;border-radius:8px;
  cursor:pointer;font-size:.76rem;font-weight:600;transition:all .15s;font-family:inherit}
.pb:hover,.pb.act{background:var(--pri);color:#fff;border-color:var(--pri)}
.pb:disabled{opacity:.3;cursor:not-allowed}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px)}
.mo.open{opacity:1;pointer-events:all}
.md{background:#fff;border-radius:20px;width:100%;max-width:620px;max-height:90vh;
  overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);
  transform:scale(.95) translateY(16px);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mo.open .md{transform:scale(1) translateY(0)}
.md.lg{max-width:800px}
.md-h{padding:18px 22px;border-bottom:1px solid var(--b);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.md-h h3{font-size:.95rem;font-weight:800;color:#0f172a}
.md-cl{border:none;background:transparent;font-size:1.15rem;cursor:pointer;
  color:#94a3b8;padding:5px;border-radius:7px;line-height:1;transition:all .15s}
.md-cl:hover{background:#f1f5f9;color:var(--red)}
.md-b{padding:22px}
.md-f{padding:14px 22px;border-top:1px solid var(--b);display:flex;justify-content:flex-end;gap:10px}

/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi.full{grid-column:1/-1}
.fi label{font-size:.69rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px}
.fi input,.fi select,.fi textarea{padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:9px;
  font-size:.875rem;outline:none;font-family:inherit;background:#f8fafc;color:#0f172a;transition:all .18s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.fi textarea{resize:vertical;min-height:68px}

/* TOAST */
.tw2{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{padding:11px 16px;border-radius:10px;font-size:.81rem;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.14);animation:tIn .22s ease;display:flex;align-items:center;gap:8px;max-width:300px;min-width:200px}
.toast.ts{background:#fff;color:var(--grn-d);border-left:4px solid var(--grn)}
.toast.te{background:#fff;color:var(--red-d);border-left:4px solid var(--red)}
.toast.ti{background:#fff;color:var(--pri-d);border-left:4px solid var(--pri)}
.toast.tw{background:#fff;color:var(--amb-d);border-left:4px solid var(--amb)}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--b);margin-bottom:18px;overflow-x:auto;gap:2px}
.tab{padding:9px 16px;border:none;background:transparent;font-size:.81rem;font-weight:600;
  color:#94a3b8;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;
  transition:all .18s;white-space:nowrap;font-family:inherit;border-radius:8px 8px 0 0}
.tab.act{color:var(--pri);border-bottom-color:var(--pri);background:#f5f7ff;font-weight:700}
.tab:hover:not(.act){color:#64748b;background:#f8fafc}
.tp{display:none}.tp.act{display:block}

/* STAFF CARDS */
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.stc{background:#fff;border:1.5px solid var(--b);border-radius:var(--r);padding:16px;transition:all .18s;position:relative}
.stc:hover{box-shadow:var(--sh);border-color:var(--pri)}
.stc-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.stc-name{font-weight:700;font-size:.88rem;color:#0f172a}
.stc-role{font-size:.71rem;color:#64748b;margin-top:2px}
.stc-id{font-size:.67rem;color:#94a3b8;margin-top:2px;font-family:monospace}
.stc-act{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.stc-meta{font-size:.72rem;color:#64748b;border-top:1px solid #f1f5f9;padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:4px}

/* PLANT CARDS */
.plg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.plc{background:#fff;border-radius:var(--r);border:1.5px solid var(--b);overflow:hidden;transition:all .2s}
.plc:hover{box-shadow:var(--sh);border-color:var(--pri);transform:translateY(-2px)}
.plc-h{padding:18px;color:#fff;position:relative}
.plc-h h3{font-size:.95rem;font-weight:800}
.plc-h p{font-size:.73rem;opacity:.85;margin-top:3px}
.plc-b{padding:14px 16px}
.plc-meta{font-size:.74rem;color:#64748b;display:flex;flex-direction:column;gap:5px}
.plc-meta span{display:flex;align-items:center;gap:6px}
.plc-f{padding:11px 16px;border-top:1px solid #f1f5f9;display:flex;gap:8px;flex-wrap:wrap}

/* ATTENDANCE */
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ac{background:#f8fafc;border:1.5px solid var(--b);border-radius:var(--r2);padding:14px}
.ac-name{font-weight:700;font-size:.86rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ab-row{display:flex;gap:5px;flex-wrap:wrap}
.ab{padding:5px 10px;border-radius:7px;border:1.5px solid transparent;cursor:pointer;
  font-size:.72rem;font-weight:700;font-family:inherit;transition:all .15s}
.ab.P{background:var(--grn-l);color:var(--grn-d);border-color:#6ee7b7}
.ab.P.sel,.ab.P:hover{background:var(--grn);color:#fff;border-color:var(--grn)}
.ab.A{background:var(--red-l);color:var(--red-d);border-color:#fca5a5}
.ab.A.sel,.ab.A:hover{background:var(--red);color:#fff;border-color:var(--red)}
.ab.H{background:var(--amb-l);color:var(--amb-d);border-color:#fcd34d}
.ab.H.sel,.ab.H:hover{background:var(--amb);color:#fff;border-color:var(--amb)}
.ab.L{background:var(--pur-l);color:var(--pur-d);border-color:#c4b5fd}
.ab.L.sel,.ab.L:hover{background:var(--pur);color:#fff;border-color:var(--pur)}

/* ALERT */
.albox{border-radius:var(--r2);padding:13px 16px;margin-bottom:14px;display:flex;gap:11px;align-items:flex-start;font-size:.8rem}
.albox.warn{background:var(--amb-l);border:1px solid #fcd34d}
.albox.info{background:var(--pri-l);border:1px solid #a5b4fc}
.albox.suc{background:var(--grn-l);border:1px solid #6ee7b7}
.albox h4{font-size:.84rem;font-weight:700;margin-bottom:3px}
.albox p{line-height:1.6}

/* WELCOME */
.welcome{text-align:center;padding:60px 20px}
.welcome .wi{font-size:4.5rem;display:block;margin-bottom:14px}
.welcome h2{font-size:1.35rem;font-weight:800;color:#0f172a;margin-bottom:8px}
.welcome p{font-size:.88rem;color:#64748b;max-width:380px;margin:0 auto}
.divider{border:none;border-top:1px solid var(--b);margin:18px 0}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .content{margin-left:0}
  .mob-menu{display:block}

<script>
var DB={MASTER:{u:'masteradmin',p:'Master@2024',name:'Master Administrator'},plants:[],staff:[],enquiries:[],orders:[],attendance:[],stock:[],salaries:[],challans:[],load:function(){['plants','staff','enquiries','orders','attendance','stock','salaries','challans'].forEach(function(k){try{var v=localStorage.getItem('pp_'+k);if(v)DB[k]=JSON.parse(v);}catch(e){}});},save:function(k){try{localStorage.setItem('pp_'+k,JSON.stringify(DB[k]));}catch(e){}},nid:function(arr){return arr.length?Math.max.apply(null,arr.map(function(x){return x.id||0}))+1:1;}};
var SES={role:null,user:null,pid:null};var curRole='master';DB.load();
function setRole(r){curRole=r;document.querySelectorAll('.rtab').forEach(function(t){t.classList.remove('act');});document.getElementById('rtab-'+r).classList.add('act');}
function doLogin(){var u=document.getElementById('lUser').value.trim();var p=document.getElementById('lPass').value.trim();var err=document.getElementById('lerr');err.style.display='none';if(!u||!p){showErr(err,'Please enter username and password.');return;}if(curRole==='master'){if(u===DB.MASTER.u&&p===DB.MASTER.p){SES={role:'master',user:{name:DB.MASTER.name,u:u},pid:null};launchApp();}else showErr(err,'Invalid master admin credentials.');return;}if(curRole==='owner'){var pl=DB.plants.find(function(x){return x.ou===u&&x.op===p&&x.st==='active';});if(pl){SES={role:'owner',user:{name:pl.on,u:u,pid:pl.id},pid:pl.id};launchApp();}else showErr(err,'Invalid owner credentials or account inactive.');return;}if(curRole==='staff'){var sf=DB.staff.find(function(x){return x.u===u&&x.p===p&&x.st==='active';});if(sf){var plant=DB.plants.find(function(x){return x.id===sf.pid&&x.st==='active';});if(plant){SES={role:sf.role,user:{name:sf.name,u:u,sfid:sf.id,pid:sf.pid},pid:sf.pid};launchApp();}else showErr(err,'Plant account inactive.');}else showErr(err,'Invalid staff credentials.');}}
function showErr(el,msg){el.textContent=msg;el.style.display='block';}
function doLogout(){SES={role:null,user:null,pid:null};document.getElementById('loginPage').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('lUser').value='';document.getElementById('lPass').value='';document.getElementById('lerr').style.display='none';}function launchApp(){document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';var rl={master:'Master Admin',owner:'Plant Owner',office:'Office Staff',sales:'Sales Staff'};document.getElementById('sb-name').textContent=SES.user.name;document.getElementById('sb-role').textContent=rl[SES.role]||SES.role;document.getElementById('topRole').textContent=rl[SES.role]||SES.role;if(SES.pid){var pl=DB.plants.find(function(x){return x.id===SES.pid;});if(pl){document.getElementById('sb-plant').textContent=pl.name;document.getElementById('topPlant').textContent=pl.name;document.getElementById('topPlant').style.display='';}}else{document.getElementById('sb-plant').textContent='';document.getElementById('topPlant').style.display='none';}buildNav();goPage('dashboard');}
function buildNav(){var nav=document.getElementById('mainNav');var items=getNav();var html='';var sec='';items.forEach(function(it){if(it.s&&it.s!==sec){sec=it.s;html+='<div class="nsec">'+it.s+'</div>';}html+='<div class="ni" id="n-'+it.id+'" onclick="goPage(\''+it.id+'\')"><span class="ni-ico">'+it.i+'</span>'+it.l+'</div>';});nav.innerHTML=html;}
function getNav(){var r=SES.role;if(r==='master')return[{s:'Overview',id:'dashboard',i:'Dashboard',l:'Dashboard'},{s:'Management',id:'plants',i:'Plants',l:'Plant Owners'},{s:'Reports',id:'allrpt',i:'Rpt',l:'All Reports'},{s:'System',id:'settings',i:'Cfg',l:'Settings'}];if(r==='owner')return[{s:'Overview',id:'dashboard',i:'D',l:'Dashboard'},{s:'Staff',id:'staff',i:'S',l:'My Staff'},{s:'Business',id:'enq',i:'E',l:'Enquiries'},{s:'',id:'orders',i:'O',l:'Orders'},{s:'',id:'challan',i:'C',l:'Challans'},{s:'Operations',id:'att',i:'A',l:'Attendance'},{s:'',id:'stock',i:'K',l:'Stock Register'},{s:'',id:'salary',i:'$',l:'Salary'},{s:'Reports',id:'reports',i:'R',l:'Reports'}];return[{s:'Overview',id:'dashboard',i:'D',l:'Dashboard'},{s:'Business',id:'enq',i:'E',l:'Enquiries'},{s:'',id:'orders',i:'O',l:'Orders'},{s:'',id:'challan',i:'C',l:'Challans'},{s:'Operations',id:'att',i:'A',l:'Attendance'},{s:'',id:'stock',i:'K',l:'Stock Register'}];}
var PT={dashboard:'Dashboard',plants:'Plant Owners',staff:'Staff Management',enq:'Enquiries',orders:'Orders',challan:'Delivery Challans',att:'Attendance',stock:'Stock Register',salary:'Salary Management',reports:'Reports',allrpt:'All Reports',settings:'Settings'};
function goPage(id){document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('act');});var ni=document.getElementById('n-'+id);if(ni)ni.classList.add('act');document.getElementById('pgTitle').textContent=PT[id]||id;document.getElementById('pgCrumb').textContent='Home > '+(PT[id]||id);var pc=document.getElementById('pageContent');var pages={dashboard:renderDash,plants:renderPlants,staff:renderStaff,enq:renderEnq,orders:renderOrders,challan:renderChallan,att:renderAtt,stock:renderStock,salary:renderSalary,reports:renderReports,allrpt:renderAllRpt,settings:renderSettings};if(pages[id])pages[id](pc);else pc.innerHTML='<div class="welcome"><h2>Coming Soon</h2></div>';}function sc2(l,v,i,c){return '<div class="sc '+(c||'')+'"><div class="sc-bg-ico">'+i+'</div><div class="sc-lb">'+l+'</div><div class="sc-val">'+v+'</div></div>';}
function renderDash(pc){var r=SES.role,pid=SES.pid;if(r==='master'){var tp=DB.plants.length,ap=DB.plants.filter(function(x){return x.st==='active';}).length;var ts=DB.staff.length,to=DB.orders.length,te=DB.enquiries.length;var tr2=DB.orders.reduce(function(a,o){return a+(+o.total||0);},0);pc.innerHTML='<div class="albox info"><span>Info</span><div><h4>Master Admin Dashboard</h4><p>Full access to all plant accounts.</p></div></div><div class="sg">'+sc2('Total Plants',tp,'P','')+sc2('Active Plants',ap,'A','g')+sc2('Total Staff',ts,'S','s')+sc2('Total Orders',to,'O','a')+sc2('Enquiries',te,'E','pu')+sc2('Revenue','Rs'+fmt(tr2),'R','g')+'</div><div class="sec"><div class="sec-h"><h3>Recent Plant Owners</h3><button class="btn btn-p btn-sm" onclick="goPage(\'plants\')">View All</button></div><div class="tw"><table><thead><tr><th>#</th><th>Plant</th><th>Owner</th><th>Phone</th><th>Staff</th><th>Status</th><th>Created</th></tr></thead><tbody>'+(DB.plants.length?DB.plants.slice().reverse().slice(0,5).map(function(pl,i){var sCnt=DB.staff.filter(function(s){return s.pid===pl.id;}).length;return '<tr><td>'+(i+1)+'</td><td><strong>'+pl.name+'</strong></td><td>'+pl.on+'</td><td>'+pl.phone+'</td><td>'+sCnt+'</td><td>'+sbadge(pl.st)+'</td><td>'+fd(pl.ca)+'</td></tr>';}).join(''):'<tr><td colspan="7" class="nd">No plant owners yet.</td></tr>')+'</tbody></table></div></div>';}else{var myO=DB.orders.filter(function(o){return o.pid===pid;});var myE=DB.enquiries.filter(function(e){return e.pid===pid;});var myS=DB.staff.filter(function(s){return s.pid===pid;});var myRev=myO.reduce(function(a,o){return a+(+o.total||0);},0);var today=new Date().toISOString().slice(0,10);var todayA=DB.attendance.filter(function(a){return a.pid===pid&&a.date===today&&a.st==='P';}).length;var pending=myO.filter(function(o){return o.st==='pending';}).length;pc.innerHTML='<div class="sg">'+sc2('Orders',myO.length,'O','')+sc2('Pending',pending,'P','a')+sc2('Enquiries',myE.length,'E','s')+sc2('Staff',myS.length,'S','pu')+sc2('Present Today',todayA,'A','g')+sc2('Revenue','Rs'+fmt(myRev),'R','g')+'</div><div class="sec"><div class="sec-h"><h3>Recent Orders</h3><button class="btn btn-p btn-sm" onclick="goPage(\'orders\')">View All</button></div><div class="tw"><table><thead><tr><th>#</th><th>Date</th><th>Customer</th><th>Grade</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead><tbody>'+(myO.length?myO.slice().reverse().slice(0,5).map(function(o,i){return '<tr><td>'+(i+1)+'</td><td>'+fd(o.date)+'</td><td><strong>'+o.cust+'</strong></td><td>'+o.grade+'</td><td>'+o.qty+'</td><td><strong>Rs'+fmt(o.total)+'</strong></td><td>'+sbadge(o.st)+'</td></tr>';}).join(''):'<tr><td colspan="7" class="nd">No orders yet.</td></tr>')+'</tbody></table></div></div>';}}function renderPlants(pc){if(SES.role!=='master'){pc.innerHTML='<div class="welcome"><h2>Access Denied</h2></div>';return;}pc.innerHTML='<div class="sec"><div class="sec-h"><h3>Plant Owner Accounts</h3><button class="btn btn-p" onclick="openPlantMo()">Add Plant Owner</button></div><div class="sec-b"><div class="tb2"><div class="sbox"><input type="text" id="plSrch" placeholder="Search plants..." oninput="refPl()"></div><select class="fsel" id="plSt" onchange="refPl()"><option value="">All Status</option><option>active</option><option>inactive</option></select></div><div class="plg" id="plGrid"></div></div></div>';refPl();}
function refPl(){var grid=document.getElementById('plGrid');if(!grid)return;var q=(document.getElementById('plSrch')||{}).value||'';var st=(document.getElementById('plSt')||{}).value||'';var data=DB.plants.filter(function(p){return(!q||(p.name+p.on).toLowerCase().includes(q.toLowerCase()))&&(!st||p.st===st);});if(!data.length){grid.innerHTML='<div class="nd" style="grid-column:1/-1;padding:40px">No plant owners found.</div>';return;}var cols=[['#6366f1','#8b5cf6'],['#0ea5e9','#06b6d4'],['#10b981','#059669'],['#f59e0b','#f97316'],['#ef4444','#dc2626']];grid.innerHTML=data.map(function(pl){var sc3=DB.staff.filter(function(s){return s.pid===pl.id;}).length;var oc=DB.orders.filter(function(o){return o.pid===pl.id;}).length;var c=cols[pl.id%cols.length];return '<div class="plc"><div class="plc-h" style="background:linear-gradient(135deg,'+c[0]+','+c[1]+')"><h3>'+pl.name+'</h3><p>Owner: '+pl.on+'</p></div><div class="plc-b"><div class="plc-meta"><span>Phone: '+pl.phone+'</span>'+(pl.email?'<span>Email: '+pl.email+'</span>':'')+(pl.addr?'<span>Address: '+pl.addr+'</span>':'')+'<span>'+sc3+' staff | '+oc+' orders</span><span>Login ID: <strong>'+pl.ou+'</strong></span><span>'+sbadge(pl.st)+' Created: '+fd(pl.ca)+'</span></div></div><div class="plc-f"><button class="btn btn-o btn-sm" onclick="editPlant('+pl.id+')">Edit</button><button class="btn btn-sm" style="background:'+(pl.st==='active'?'#fee2e2':'#d1fae5')+';color:'+(pl.st==='active'?'#dc2626':'#059669')+'" onclick="togglePl('+pl.id+')">'+(pl.st==='active'?'Deactivate':'Activate')+'</button><button class="btn btn-r btn-sm" onclick="delPl('+pl.id+')">Delete</button></div></div>';}).join('');}
function openPlantMo(id){var p=id?DB.plants.find(function(x){return x.id===id;}):null;showMo('lg',(p?'Edit':'Add')+' Plant Owner','<div class="fg">'+fi('Plant Name *','text','pm_nm',p?p.name:'','e.g. Shree Ram RMC Plant')+fi('Owner Full Name *','text','pm_on',p?p.on:'')+fi('Phone *','tel','pm_ph',p?p.phone:'')+fi('Email','email','pm_em',p?p.email:'')+fi('GST Number','text','pm_gs',p?p.gst:'','',true)+fi('Plant Address','text','pm_ad',p?p.addr:'','',true)+'<div class="fi full"><hr style="border:none;border-top:1px solid #e2e8f0;margin:8px 0"><p style="font-size:.8rem;font-weight:700;color:#64748b">Login Credentials for Plant Owner</p></div>'+fi('Owner Username *','text','pm_us',p?p.ou:'')+fi('Owner Password *','password','pm_pw',p?p.op:'')+fis('Status','pm_st',['active','inactive'],p?p.st:'active')+'</div>','<button class="btn btn-gh" onclick="closeMo()">Cancel</button><button class="btn btn-p" onclick="savePl('+(p?p.id:'null')+')">Save Plant Owner</button>');}
function editPlant(id){openPlantMo(id);}
function savePl(id){var nm=gv('pm_nm'),on=gv('pm_on'),ph=gv('pm_ph'),em=gv('pm_em'),gs=gv('pm_gs'),ad=gv('pm_ad'),us=gv('pm_us'),pw=gv('pm_pw'),st=gv('pm_st');if(!nm||!on||!ph||!us||!pw){toast('Fill all required (*) fields','e');return;}if(!id&&DB.plants.find(function(x){return x.ou===us;})){toast('Username already exists!','e');return;}if(id&&DB.plants.find(function(x){return x.ou===us&&x.id!==id;})){toast('Username already taken!','e');return;}if(pw.length<6){toast('Password min 6 characters','e');return;}if(id){var idx=DB.plants.findIndex(function(x){return x.id===id;});if(idx>-1)DB.plants[idx]=Object.assign(DB.plants[idx],{name:nm,on:on,phone:ph,email:em,gst:gs,addr:ad,ou:us,op:pw,st:st});toast('Plant owner updated!','s');}else{DB.plants.push({id:DB.nid(DB.plants),name:nm,on:on,phone:ph,email:em,gst:gs,addr:ad,ou:us,op:pw,st:st,ca:new Date().toISOString()});toast('Plant owner created!','s');}DB.save('plants');closeMo();refPl();}
function togglePl(id){var p=DB.plants.find(function(x){return x.id===id;});if(!p)return;p.st=p.st==='active'?'inactive':'active';DB.save('plants');refPl();toast('Plant '+(p.st==='active'?'activated':'deactivated'),'s');}
function delPl(id){if(!confirm('Delete plant and ALL its data permanently?'))return;DB.plants=DB.plants.filter(function(x){return x.id!==id;});DB.staff=DB.staff.filter(function(x){return x.pid!==id;});DB.orders=DB.orders.filter(function(x){return x.pid!==id;});DB.enquiries=DB.enquiries.filter(function(x){return x.pid!==id;});DB.attendance=DB.attendance.filter(function(x){return x.pid!==id;});DB.stock=DB.stock.filter(function(x){return x.pid!==id;});DB.salaries=DB.salaries.filter(function(x){return x.pid!==id;});DB.challans=DB.challans.filter(function(x){return x.pid!==id;});['plants','staff','orders','enquiries','attendance','stock','salaries','challans'].forEach(function(k){DB.save(k);});toast('Plant deleted','i');refPl();}function renderStaff(pc){if(SES.role!=='owner'){pc.innerHTML='<div class="welcome"><h2>Access Denied</h2></div>';return;}pc.innerHTML='<div class="tabs"><button class="tab act" onclick="swTab(this,\'tp-of\')">Office Staff</button><button class="tab" onclick="swTab(this,\'tp-sl\')">Sales Staff</button></div><div class="tp act" id="tp-of"></div><div class="tp" id="tp-sl"></div>';refStaff('office');refStaff('sales');}
function refStaff(role){var pid=SES.pid;var data=DB.staff.filter(function(s){return s.pid===pid&&s.role===role;});var el=document.getElementById(role==='office'?'tp-of':'tp-sl');if(!el)return;var typeLabel=role==='office'?'Office':'Sales';el.innerHTML='<div class="sec"><div class="sec-h"><h3>'+typeLabel+' Staff</h3><button class="btn btn-p" onclick="openStMo(null,\''+role+'\')">Add '+ucf(role)+' Staff</button></div><div class="sec-b"><div class="stg">'+(data.length?data.map(function(s){return '<div class="stc"><div class="stc-top"><div class="av '+(role==='office'?'av-p':'av-g')+'">'+ini(s.name)+'</div><div><div class="stc-name">'+s.name+'</div><div class="stc-role">'+ucf(role)+' Staff</div><div class="stc-id">ID: '+s.u+'</div></div></div><div class="stc-act"><button class="btn btn-sm btn-o" onclick="editSt('+s.id+')">Edit</button><button class="btn btn-sm btn-r" onclick="delSt('+s.id+')">Del</button></div><div class="stc-meta"><span>Phone: '+s.phone+'</span>'+(s.desig?'<span>'+s.desig+'</span>':'')+'<span>Joined: '+fd(s.join)+'</span><span>'+sbadge(s.st)+'</span></div></div>';}).join(''):'<div class="nd" style="grid-column:1/-1;padding:36px">No '+role+' staff yet.</div>')+'</div></div></div>';}
function openStMo(id,defRole){var pid=SES.pid;var s=id?DB.staff.find(function(x){return x.id===id;}):null;var today=new Date().toISOString().slice(0,10);showMo('',(s?'Edit':'Add')+' Staff Member','<div class="fg">'+fi('Full Name *','text','sm_nm',s?s.name:'')+fis('Role *','sm_rl',[{v:'office',l:'Office Staff'},{v:'sales',l:'Sales Staff'}],s?s.role:(defRole||'office'))+fi('Username / Staff ID *','text','sm_us',s?s.u:'')+fi('Password *','password','sm_pw',s?s.p:'')+fi('Phone *','tel','sm_ph',s?s.phone:'')+fi('Email','email','sm_em',s?s.email:'')+fi('Designation','text','sm_ds',s?s.desig:'')+fi('Join Date','date','sm_jd',s?s.join:today)+fi('Basic Pay (Rs/month)','number','sm_py',s?s.pay:'')+fis('Status','sm_st',['active','inactive'],s?s.st:'active')+'</div>','<button class="btn btn-gh" onclick="closeMo()">Cancel</button><button class="btn btn-p" onclick="saveSt('+(s?s.id:'null')+','+pid+')">Save Staff</button>');}

function saveStk(id,pid){var dt=gv('sk_dt'),mt=gv('sk_mt'),op=gv('sk_op'),rv=gv('sk_rv'),us=gv('sk_us'),un=gv('sk_un'),rm=gv('sk_rm');if(!dt||!mt){toast('Date and Material required','e');return;}var rec={date:dt,mat:mt,op:op||0,rv:rv||0,us:us||0,unit:un,rmk:rm,pid:pid};if(id){var idx=DB.stock.findIndex(function(x){return x.id===id;});if(idx>-1)DB.stock[idx]=Object.assign(DB.stock[idx],rec);toast('Updated!','s');}else{rec.id=DB.nid(DB.stock);rec.ca=new Date().toISOString();DB.stock.push(rec);toast('Entry added!','s');}DB.save('stock');closeMo();refStk();}
function delStk(id){if(!confirm('Delete entry?'))return;DB.stock=DB.stock.filter(function(x){return x.id!==id;});DB.save('stock');refStk();toast('Deleted','i');}function renderSalary(pc){var pid=SES.pid;var months=['January','February','March','April','May','June','July','August','September','October','November','December'];var cm=new Date().getMonth(),cy=new Date().getFullYear();pc.innerHTML='<div class="sec"><div class="sec-h"><h3>Salary Management</h3></div><div class="sec-b"><div class="tb2"><select class="fsel" id="sl_mn">'+months.map(function(m,i){return '<option value="'+(i+1)+'"'+(i===cm?' selected':'')+'>'+m+'</option>';}).join('')+'</select><select class="fsel" id="sl_yr">'+[cy-1,cy,cy+1].map(function(y){return '<option value="'+y+'"'+(y===cy?' selected':'')+'>'+y+'</option>';}).join('')+'</select><button class="btn btn-p" onclick="refSal()">Load</button></div><div class="tw"><table><thead><tr><th>#</th><th>Staff Name</th><th>Role</th><th>Basic Pay</th><th>Allowances</th><th>Deductions</th><th>Net Pay</th><th>Status</th><th>Action</th></tr></thead><tbody id="slTb"></tbody></table></div></div></div>';refSal();}
function refSal(){var pid=SES.pid,mo=+(gv('sl_mn')),yr=+(gv('sl_yr'));var myStaff=DB.staff.filter(function(s){return s.pid===pid&&s.st==='active';});var tb=document.getElementById('slTb');if(!tb)return;tb.innerHTML=myStaff.length?myStaff.map(function(s,i){var sal=DB.salaries.find(function(x){return x.pid===pid&&x.sid===s.id&&x.mo===mo&&x.yr===yr;});var basic=+(s.pay)||0,allow=sal?+(sal.allow)||0:0,deduct=sal?+(sal.deduct)||0:0,net=sal?+(sal.net):(basic+allow-deduct);return '<tr><td>'+(i+1)+'</td><td><strong>'+s.name+'</strong></td><td><span class="badge '+(s.role==='office'?'b-p':'b-g')+'">'+ucf(s.role)+'</span></td><td>Rs'+fmt(basic)+'</td><td>Rs'+fmt(allow)+'</td><td>Rs'+fmt(deduct)+'</td><td><strong>Rs'+fmt(net)+'</strong></td><td>'+(sal?sbadge(sal.st):'<span class="badge b-gr">Pending</span>')+'</td><td><button class="btn btn-sm btn-p" onclick="openSalMo('+s.id+','+mo+','+yr+')">'+( sal?'Edit':'Process')+'</button></td></tr>';}).join(''):'<tr><td colspan="9" class="nd">No active staff.</td></tr>';}
function openSalMo(sid,mo,yr){var pid=SES.pid,s=DB.staff.find(function(x){return x.id===sid;});var sal=DB.salaries.find(function(x){return x.pid===pid&&x.sid===sid&&x.mo===mo&&x.yr===yr;});showMo('','Process Salary - '+s.name,'<div class="fg">'+fi('Basic Pay (Rs)','number','sa_bp',sal?sal.basic:s.pay||0,'',false,'onchange="calcNet()"')+fi('Allowances (Rs)','number','sa_al',sal?sal.allow:'0','HRA, Travel etc.',false,'onchange="calcNet()"')+fi('Deductions (Rs)','number','sa_dd',sal?sal.deduct:'0','PF, Advance etc.',false,'onchange="calcNet()"')+fi('Net Pay (Rs)','number','sa_np',sal?sal.net:(+(s.pay)||0),'Auto-calculated')+fi('Paid Date','date','sa_pd',sal?sal.pd:new Date().toISOString().slice(0,10))+fis('Status','sa_st',['pending','paid','hold'],sal?sal.st:'pending')+'</div>','<button class="btn btn-gh" onclick="closeMo()">Cancel</button><button class="btn btn-p" onclick="saveSal('+sid+','+mo+','+yr+','+pid+')">Save</button>');}
function calcNet(){var bp=+(gv('sa_bp'))||0,al=+(gv('sa_al'))||0,dd=+(gv('sa_dd'))||0;var nf=document.getElementById('sa_np');if(nf)nf.value=(bp+al-dd).toFixed(2);}
function saveSal(sid,mo,yr,pid){var bp=gv('sa_bp'),al=gv('sa_al'),dd=gv('sa_dd'),np=gv('sa_np'),pd=gv('sa_pd'),st=gv('sa_st');var rec={pid:pid,sid:sid,mo:mo,yr:yr,basic:bp,allow:al,deduct:dd,net:np,pd:pd,st:st};var idx=DB.salaries.findIndex(function(x){return x.pid===pid&&x.sid===sid&&x.mo===mo&&x.yr===yr;});if(idx>-1)DB.salaries[idx]=Object.assign(DB.salaries[idx],rec);else{rec.id=DB.nid(DB.salaries);DB.salaries.push(rec);}DB.save('salaries');closeMo();refSal();toast('Salary saved!','s');}
function renderReports(pc){var pid=SES.pid;pc.innerHTML='<div class="tabs"><button class="tab act" onclick="swTab(this,\'rp-or\')">Orders</button><button class="tab" onclick="swTab(this,\'rp-eq\')">Enquiries</button><button class="tab" onclick="swTab(this,\'rp-at\')">Attendance</button><button class="tab" onclick="swTab(this,\'rp-sk\')">Stock</button></div><div class="tp act" id="rp-or">'+rptSec('Orders',DB.orders.filter(function(o){return o.pid===pid;}),'or',pid)+'</div><div class="tp" id="rp-eq">'+rptSec('Enquiries',DB.enquiries.filter(function(e){return e.pid===pid;}),'eq',pid)+'</div><div class="tp" id="rp-at">'+rptSec('Attendance',DB.attendance.filter(function(a){return a.pid===pid;}),'at',pid)+'</div><div class="tp" id="rp-sk">'+rptSec('Stock',DB.stock.filter(function(s){return s.pid===pid;}),'sk',pid)+'</div>';}
function rptSec(title,data,type,pid){var pl=DB.plants.find(function(x){return x.id===pid;})||{name:''};return '<div class="sec"><div class="sec-h"><h3>'+title+' Report</h3><button class="btn btn-p btn-sm" onclick="expPDF(\''+type+'\','+pid+')">Export PDF</button></div><div class="sec-b"><div class="albox info"><span>Info</span><div><h4>'+pl.name+'</h4><p>Total '+title+' records: <strong>'+data.length+'</strong></p></div></div></div></div>';}
function renderAllRpt(pc){pc.innerHTML='<div class="sec"><div class="sec-h"><h3>All Plants Summary</h3></div><div class="tw"><table><thead><tr><th>Plant Name</th><th>Owner</th><th>Staff</th><th>Enquiries</th><th>Orders</th><th>Revenue</th><th>Status</th></tr></thead><tbody>'+(DB.plants.length?DB.plants.map(function(pl){var staff=DB.staff.filter(function(s){return s.pid===pl.id;}).length;var enqs=DB.enquiries.filter(function(e){return e.pid===pl.id;}).length;var orders=DB.orders.filter(function(o){return o.pid===pl.id;});var rev=orders.reduce(function(a,o){return a+(+(o.total)||0);},0);return '<tr><td><strong>'+pl.name+'</strong></td><td>'+pl.on+'</td><td>'+staff+'</td><td>'+enqs+'</td><td>'+orders.length+'</td><td><strong>Rs'+fmt(rev)+'</strong></td><td>'+sbadge(pl.st)+'</td></tr>';}).join(''):'<tr><td colspan="7" class="nd">No plants yet.</td></tr>')+'</tbody></table></div></div>';}
function renderSettings(pc){pc.innerHTML='<div class="sec"><div class="sec-h"><h3>System Settings</h3></div><div class="sec-b"><div class="albox warn"><span>Warning</span><div><h4>Master Admin Credentials</h4><p>Username: <strong>masteradmin</strong> Password: <strong>Master@2024</strong><br>Change in source code (DB.MASTER) for production.</p></div></div><hr style="border:none;border-top:1px solid #e2e8f0;margin:18px 0"><h4 style="font-weight:700;margin-bottom:12px">Data Management</h4><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-s" onclick="expAll()">Export All Data</button><button class="btn btn-a" onclick="impData()">Import Data</button><button class="btn btn-r" onclick="clrAll()">Clear All Data</button></div></div></div>';}
function expAll(){var d={plants:DB.plants,staff:DB.staff,orders:DB.orders,enquiries:DB.enquiries,attendance:DB.attendance,stock:DB.stock,salaries:DB.salaries,challans:DB.challans,exportedAt:new Date().toISOString(),version:'2.0'};var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plantpro_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup exported!','s');}
function impData(){var inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);['plants','staff','orders','enquiries','attendance','stock','salaries','challans'].forEach(function(k){if(d[k])DB[k]=d[k];DB.save(k);});toast('Data restored!','s');goPage('dashboard');}catch(ex){toast('Invalid file','e');}};r.readAsText(f);};inp.click();}
function clrAll(){if(!confirm('DANGER: Delete ALL data permanently?'))return;var c=prompt('Type DELETE to confirm:');if(c!=='DELETE'){toast('Cancelled','i');return;}DB.plants=[];DB.staff=[];DB.orders=[];DB.enquiries=[];DB.attendance=[];DB.stock=[];DB.salaries=[];DB.challans=[];['plants','staff','orders','enquiries','attendance','stock','salaries','challans'].forEach(function(k){DB.save(k);});toast('All data cleared!','w');goPage('dashboard');}function expPDF(type,pid){if(typeof jsPDF==='undefined'){toast('PDF library not loaded','e');return;}var doc=new jsPDF.jsPDF();var pl=DB.plants.find(function(x){return x.id===pid;})||{name:'PlantPro'};doc.setFontSize(14);doc.text(pl.name+' - Report',14,15);doc.setFontSize(9);doc.text('Generated: '+new Date().toLocaleDateString('en-IN'),14,22);var head=[],rows=[];if(type==='or'){head=[['#','Date','Customer','Grade','Qty','Rate','Total','Status']];rows=DB.orders.filter(function(o){return o.pid===pid;}).map(function(o,i){return[i+1,fd(o.date),o.cust,o.grade,o.qty,o.rate,o.total,o.st];});}else if(type==='eq'){head=[['#','Date','Customer','Phone','Grade','Qty','Status']];rows=DB.enquiries.filter(function(e){return e.pid===pid;}).map(function(e,i){return[i+1,fd(e.date),e.cust,e.phone,e.grade,e.qty,e.st];});}else if(type==='sk'){head=[['#','Date','Material','Opening','Received','Used','Unit']];rows=DB.stock.filter(function(s){return s.pid===pid;}).map(function(s,i){return[i+1,fd(s.date),s.mat,s.op,s.rv,s.us,s.unit];});}else if(type==='at'){head=[['#','Date','Staff','Status']];rows=DB.attendance.filter(function(a){return a.pid===pid;}).map(function(a,i){var sf=DB.staff.find(function(x){return x.id===a.sid;})||{name:'Unknown'};return[i+1,a.date,sf.name,a.st];});}doc.autoTable({head:head,body:rows,startY:28,styles:{fontSize:8},headStyles:{fillColor:[99,102,241],textColor:255,fontStyle:'bold'}});doc.save(type+'_report_'+new Date().toISOString().slice(0,10)+'.pdf');toast('PDF exported!','s');}
function fi(label,type,id,val,ph,full,extra){val=String(val||'').replace(/"/g,'&quot;');return '<div class="fi'+(full?' full':'')+'"><label>'+label+'</label><input type="'+type+'" id="'+id+'" value="'+val+'" placeholder="'+(ph||'')+'" '+(extra||'')+'></div>';}
function fis(label,id,opts,cur,full){var options='';if(Array.isArray(opts)&&typeof opts[0]==='object'){options=opts.map(function(o){return '<option value="'+o.v+'"'+(cur===o.v?' selected':'')+'>'+o.l+'</option>';}).join('');}else{options=opts.map(function(o){return '<option value="'+o+'"'+(cur===o?' selected':'')+'>'+o+'</option>';}).join('');}return '<div class="fi'+(full?' full':'')+'"><label>'+label+'</label><select id="'+id+'">'+options+'</select></div>';}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function fd(d){if(!d)return '-';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function fmt(n){n=Number(n)||0;return n.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});}
function ini(name){return (name||'').split(' ').slice(0,2).map(function(n){return n[0]||'';}).join('').toUpperCase();}
function ucf(s){return s?s[0].toUpperCase()+s.slice(1):'';}
function sbadge(s){var m={active:'b-g',inactive:'b-r',pending:'b-a',delivered:'b-g',cancelled:'b-r',converted:'b-s',lost:'b-r',paid:'b-g',hold:'b-a',P:'b-g',A:'b-r',H:'b-a',L:'b-pu'};return '<span class="badge '+(m[s]||'b-gr')+'">'+ucf(s||'-')+'</span>';}
function swTab(el,panelId){var container=el.closest('.pc')||document.getElementById('pageContent');container.querySelectorAll('.tab').forEach(function(t){t.classList.remove('act');});el.classList.add('act');container.querySelectorAll('.tp').forEach(function(p){p.classList.remove('act');});var target=document.getElementById(panelId);if(target)target.classList.add('act');}
function pagCtrl(wrId,cur,pages,total,varName,fn){var wr=document.getElementById(wrId);if(!wr)return;var pp=12,start=(cur-1)*pp+1,end=Math.min(cur*pp,total);wr.innerHTML='<div class="pag-i">Showing '+start+'-'+end+' of '+total+'</div><div class="pag-b"><button class="pb"'+(cur<=1?' disabled':'')+' onclick="'+varName+'='+Math.max(1,cur-1)+';'+fn+'()">Prev</button>'+Array.from({length:Math.min(pages,7)},function(_,i){var p=i+1;return'<button class="pb'+(p===cur?' act':'')+'" onclick="'+varName+'='+p+';'+fn+'()">'+p+'</button>';}).join('')+'<button class="pb"'+(cur>=pages?' disabled':'')+' onclick="'+varName+'='+Math.min(pages,cur+1)+';'+fn+'()">Next</button></div>';}
function showMo(size,title,body,foot){var md=document.getElementById('md');md.className='md'+(size?' '+size:'');md.innerHTML='<div class="md-h"><h3>'+title+'</h3><button class="md-cl" onclick="closeMo()">X</button></div><div class="md-b">'+body+'</div><div class="md-f">'+foot+'</div>';document.getElementById('mo').classList.add('open');}
function closeMo(){document.getElementById('mo').classList.remove('open');}
function toast(msg,type){var ico={s:'OK',e:'ERR',i:'INFO',w:'WARN'};var tw=document.getElementById('toastWrap');var t=document.createElement('div');t.className='toast t'+(type||'i');t.innerHTML='<span>'+ico[type||'i']+'</span><span>'+msg+'</span>';tw.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='.3s';setTimeout(function(){t.remove();},300);},3500);}
function toggleSB(){document.getElementById('sidebar').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',function(){document.getElementById('lUser').focus();});
</script>
